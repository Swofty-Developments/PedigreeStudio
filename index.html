        <h1>Pedigree Studio</h1>
        <p>
          Pedigree Studio is a free pedigree chart builder that runs in your browser. Select any person to add partners, children, siblings, parents and twins. The chart
          lays itself out using standard NSGC pedigree nomenclature: affected and carrier status, deceased individuals, proband and consultand arrows, consanguinity,
          adoption, pregnancies and losses.
        </p>
        <p>Record cancer history with ages at diagnosis and genetic test results, keep several charts saved in your browser, and export them as PNG, SVG or PDF.</p>
